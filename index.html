<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Генератор КП - ГЕОМЕТР</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Заменили html2pdf на раздельные библиотеки для точного контроля -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        /* --- ТЕМНАЯ ТЕМА ИНТЕРФЕЙСА --- */
        body {
            font-family: 'Montserrat', sans-serif; margin: 0; padding: 0;
            background-color: #050505; color: #e0e0e0; display: flex; height: 100vh; overflow: hidden;
        }

        .controls-panel {
            width: 450px; background: #111; padding: 30px 25px; box-sizing: border-box;
            border-right: 1px solid #222; overflow-y: auto; z-index: 10;
        }

        .controls-panel::-webkit-scrollbar { width: 6px; }
        .controls-panel::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }

        h2 { color: #fff; font-weight: 500; margin-top: 0; letter-spacing: 2px; text-transform: uppercase; font-size: 16px; border-bottom: 1px solid #333; padding-bottom: 15px;}
        h3 { color: #888; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; margin-top: 0;}
        
        .settings-block { background: #1a1a1a; padding: 20px; border-radius: 8px; border: 1px solid #2a2a2a; margin-bottom: 25px;}
        
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 10px; margin-bottom: 6px; color: #aaa; text-transform: uppercase; letter-spacing: 1px; }
        .form-group input, .form-group select, .form-group textarea { 
            width: 100%; padding: 12px; background: #222; border: 1px solid #333; 
            color: #fff; border-radius: 4px; box-sizing: border-box; font-family: 'Montserrat', sans-serif; font-size: 12px; transition: 0.2s;
        }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: #777; outline: none; background: #2a2a2a;}
        .form-group textarea { resize: vertical; min-height: 80px; }

        .item-input-block { background: #1a1a1a; border: 1px solid #2a2a2a; padding: 20px; border-radius: 8px; margin-bottom: 15px; position: relative; }
        .remove-btn {
            position: absolute; top: 12px; right: 12px; background: none; color: #ff4444; 
            border: 1px solid #ff4444; border-radius: 4px; cursor: pointer; padding: 4px 8px; transition: 0.2s; font-size: 12px;
        }
        .remove-btn:hover { background: #ff4444; color: #fff; }

        button.action-btn {
            width: 100%; padding: 14px; border: 1px solid #444; background: #222; color: #fff; 
            border-radius: 6px; cursor: pointer; font-weight: 500; margin-bottom: 10px; text-transform: uppercase; font-size: 11px; letter-spacing: 1px; transition: 0.2s;
        }
        button.action-btn:hover { background: #333; border-color: #fff; }
        button.action-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-generate { background: #fff !important; color: #000 !important; font-weight: 600; border: none !important; margin-top: 20px; font-size: 13px;}
        .btn-generate:hover:not(:disabled) { background: #ddd !important; }

        /* --- ЗОНА ПРЕВЬЮ --- */
        .preview-panel {
            flex-grow: 1; display: flex; justify-content: center; align-items: flex-start;
            padding: 40px; overflow-y: auto; background: #000;
        }

        #pdf-wrapper { display: flex; flex-direction: column; gap: 20px; }

        /* ЖЕСТКИЕ СТИЛИ СТРАНИЦЫ А4 */
        .a4-page {
            width: 800px;
            height: 1131px;
            background: #151515;
            color: #ffffff;
            padding: 50px;
            box-sizing: border-box;
            position: relative;
            overflow: hidden;
        }

        /* Внутренние элементы КП */
        .kp-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 30px; border-bottom: 1px solid #333; padding-bottom: 25px;}
        .kp-logo h1 { margin: 0; font-size: 32px; font-weight: 300; letter-spacing: 4px; text-transform: uppercase; }
        .kp-logo p { margin: 5px 0 0 0; font-size: 12px; color: #aaa; letter-spacing: 2px; text-transform: uppercase;}
        .kp-contacts { text-align: right; font-size: 12px; color: #aaa; line-height: 1.8; }
        .kp-contacts strong { color: #fff; font-weight: 500; font-size: 14px; }
        .kp-contacts i { width: 20px; text-align: center; color: #666;}

        .kp-title-block { text-align: center; margin-bottom: 30px; }
        .kp-title-block h2 { font-size: 24px; font-weight: 400; letter-spacing: 2px; margin: 0 0 5px 0; color: #fff;}
        .kp-title-block p { font-size: 14px; color: #888; margin: 0; letter-spacing: 1px; text-transform: uppercase;}

        .kp-table { width: 100%; border-collapse: collapse; font-size: 13px; margin-bottom: 10px;}
        .kp-table th { padding: 15px 10px; text-align: left; border-top: 1px solid #444; border-bottom: 1px solid #444; color: #aaa; font-weight: 400; text-transform: uppercase; letter-spacing: 1px; font-size: 11px;}
        .kp-table th.right, .kp-table td.right { text-align: right; }
        .kp-row td { padding: 15px 10px; border-bottom: 1px solid #222; vertical-align: middle; }
        
        .visual-cell { width: 80px; }
        .visual-box { width: 60px; height: 60px; border: 1px solid #444; border-radius: 4px; display: flex; justify-content: center; align-items: center; background: #1a1a1a; overflow: hidden; }
        .visual-box img { width: 100%; height: 100%; object-fit: cover; }
        .visual-box i { font-size: 24px; color: #fff; }

        /* Единый блок итога + подвала, прибитый к низу страницы */
        .kp-bottom-block {
            position: absolute; bottom: 50px; left: 50px; right: 50px;
        }

        .kp-total-wrapper { display: flex; justify-content: flex-end; margin-bottom: 20px; }
        .kp-total-box { border: 1px solid #555; padding: 15px 30px; border-radius: 4px; text-align: right; background: #1a1a1a; }
        .kp-total-box span.lbl { display: block; font-size: 12px; color: #888; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; }
        .kp-total-box span.sum { font-size: 24px; font-weight: 600; color: #fff; }

        .kp-rich-footer {
            padding-top: 30px; border-top: 1px solid #333;
            display: flex; justify-content: space-between; gap: 40px;
        }
        .footer-col-left { flex: 2; }
        .footer-col-right { flex: 1; text-align: right; }
        .kp-rich-footer h4 { margin: 0 0 15px 0; color: #fff; font-size: 12px; letter-spacing: 2px; text-transform: uppercase; font-weight: 600; }
        .kp-rich-footer p { font-size: 11px; color: #aaa; line-height: 1.6; margin: 0 0 10px 0;}
        .footer-col-right p { font-size: 12px; margin-bottom: 8px;}
        .footer-col-right p i { color: #666; margin-right: 8px; width: 16px; text-align: center;}
        .footer-col-right strong { color: #fff; font-weight: 500;}

        /* Плашка "продолжение" для промежуточных страниц */
        .kp-continuation {
            position: absolute; bottom: 50px; left: 50px; right: 50px;
            border-top: 1px solid #333; padding-top: 18px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .kp-continuation .cont-text {
            font-size: 11px; color: #666; letter-spacing: 1px; text-transform: uppercase;
        }
        .kp-continuation .cont-text i { margin-right: 8px; color: #555; }
        .kp-continuation .cont-pages {
            font-size: 11px; color: #555; letter-spacing: 1px;
        }

        /* Номер страницы в футере последней страницы */
        .kp-page-num {
            font-size: 11px; color: #555; letter-spacing: 1px; text-align: center;
            margin-top: 18px;
        }

        /* Индикатор страниц в превью */
        .page-label {
            color: #444; font-size: 11px; text-align: center; letter-spacing: 2px;
            text-transform: uppercase; margin-bottom: 5px;
        }

        /* ═══════════════════════════════════════════
           МОБИЛЬНАЯ АДАПТАЦИЯ
        ═══════════════════════════════════════════ */

        .mobile-nav { display: none; }
        .mobile-generate-bar { display: none; }

        @media (max-width: 900px) {
            /* Сбрасываем базовый layout */
            body {
                flex-direction: column;
                height: auto;
                overflow: auto;
                overflow-x: hidden;
            }

            /* ─── Таб-навигация ─── */
            .mobile-nav {
                display: flex;
                position: sticky;
                top: 0;
                z-index: 200;
                background: #111;
                border-bottom: 1px solid #222;
                flex-shrink: 0;
            }

            .mobile-tab {
                flex: 1;
                padding: 16px 10px;
                background: none;
                border: none;
                border-bottom: 2px solid transparent;
                color: #555;
                font-family: 'Montserrat', sans-serif;
                font-size: 11px;
                text-transform: uppercase;
                letter-spacing: 1.5px;
                cursor: pointer;
                transition: color 0.2s, border-color 0.2s;
            }
            .mobile-tab i { margin-right: 6px; }
            .mobile-tab.active { color: #fff; border-bottom-color: #fff; }

            /* ─── Панель настроек ─── */
            .controls-panel {
                width: 100%;
                border-right: none;
                border-bottom: 1px solid #222;
                height: auto;
                overflow-y: visible;
                padding: 24px 16px 100px; /* нижний отступ под sticky-кнопку */
            }
            .controls-panel.tab-hidden { display: none; }

            /* Скрываем десктопную кнопку генерации в настройках */
            #btn-generate { display: none; }

            /* ─── Sticky-кнопка генерации на мобиле ─── */
            .mobile-generate-bar {
                display: none; /* показывается JS'ом только на вкладке превью */
                position: fixed;
                bottom: 0; left: 0; right: 0;
                z-index: 300;
                padding: 12px 16px;
                background: linear-gradient(to top, #111 80%, transparent);
            }
            .mobile-generate-bar.visible { display: block; }
            .mobile-generate-bar .action-btn {
                margin-bottom: 0;
                font-size: 13px;
                padding: 16px;
            }

            /* ─── Панель превью ─── */
            .preview-panel {
                flex-grow: 0;
                width: 100%;
                padding: 16px 0 80px; /* нижний отступ под sticky-кнопку */
                align-items: flex-start;
                justify-content: flex-start;
                min-height: 0;
                background: #000;
                overflow-x: hidden;
            }
            .preview-panel.tab-hidden { display: none; }

            /* ─── Масштабирование A4 ─── */
            #preview-scaler {
                transform-origin: top left;
                /* ширина и трансформ выставляются через JS */
            }

            .page-label {
                /* при scale нужен scale-компенсированный размер — обновляется JS'ом */
            }
        }

    </style>
</head>
<body>

    <!-- ─── Мобильная таб-навигация (скрыта на десктопе) ─── -->
    <div class="mobile-nav" id="mobile-nav">
        <button class="mobile-tab active" data-tab="settings" onclick="switchTab('settings')">
            <i class="fas fa-sliders-h"></i> Настройки
        </button>
        <button class="mobile-tab" data-tab="preview" onclick="switchTab('preview')">
            <i class="fas fa-eye"></i> Превью
        </button>
    </div>

    <div class="controls-panel" id="panel-settings">
        <h2>Настройки документа</h2>
        
        <div class="settings-block">
            <h3>Заголовки и Бренд</h3>
            <div class="form-group"><label>Название компании</label><input type="text" id="c-company" value="ГЕОМЕТР" oninput="updatePreview()"></div>
            <div class="form-group"><label>Подзаголовок логотипа</label><input type="text" id="c-sub" value="Создаем пространство для жизни" oninput="updatePreview()"></div>
            <div style="height: 10px;"></div>
            <div class="form-group"><label>Главный заголовок</label><input type="text" id="c-main-title" value="КОММЕРЧЕСКОЕ ПРЕДЛОЖЕНИЕ" oninput="updatePreview()"></div>
            <div class="form-group"><label>Тип работ</label><input type="text" id="c-sub-title" value="Черновые материалы" oninput="updatePreview()"></div>
        </div>

        <div class="settings-block">
            <h3>Контакты и маркетинг</h3>
            <div class="form-group"><label>Менеджер</label><input type="text" id="c-name" value="Михаил Болдок" oninput="updatePreview()"></div>
            <div class="form-group"><label>Телефон</label><input type="text" id="c-phone" value="+7 (996) 316-39-99" oninput="updatePreview()"></div>
            <div class="form-group"><label>Email</label><input type="text" id="c-email" value="nikolaevich.ba@gmail.com" oninput="updatePreview()"></div>
            
            <div class="form-group" style="margin-top:20px;">
                <label>Текст «О нас» (В подвале)</label>
                <textarea id="c-about" oninput="updatePreview()">Мы предлагаем не только надежные материалы, но и выполняем полный комплекс ремонтно-отделочных услуг. Профессионально выполняем штукатурные, шпаклевочные, малярные работы и укладку плитки. Создаем эстетичные и долговечные пространства для комфортной жизни.</textarea>
            </div>
        </div>

        <h3 style="font-size: 14px; margin-top: 30px; border-bottom: 1px solid #333; padding-bottom: 10px; color:#fff;">СПИСОК ПОЗИЦИЙ</h3>
        
        <div id="items-container"></div>

        <button class="action-btn" onclick="addItem()"><i class="fas fa-plus"></i> Добавить позицию</button>
        <button class="action-btn btn-generate" id="btn-generate" onclick="generatePDF()"><i class="fas fa-file-pdf"></i> Сохранить PDF (А4)</button>
    </div>

    <!-- Sticky-кнопка генерации на мобиле (видна только на превью-вкладке) -->
    <div class="mobile-generate-bar" id="mobile-generate-bar">
        <button class="action-btn btn-generate" onclick="generatePDF()">
            <i class="fas fa-file-pdf"></i> Сохранить PDF
        </button>
    </div>

    <div class="preview-panel" id="panel-preview">
        <div id="preview-scaler">
            <div id="pdf-wrapper"></div>
        </div>
    </div>

    <script>
        const availableIcons = [
            { val: 'fas fa-trowel', name: 'Штукатурка / Шпаклевка' },
            { val: 'fas fa-paint-roller', name: 'Малярные работы / Краска' },
            { val: 'fas fa-fill-drip', name: 'Декоративная штукатурка' },
            { val: 'fas fa-border-all', name: 'Плитка / Керамогранит' },
            { val: 'fas fa-layer-group', name: 'Ламинат / Покрытия' },
            { val: 'fas fa-tape', name: 'Расходники / Скотч' },
            { val: 'fas fa-pallet', name: 'Сухие смеси / Мешки' },
            { val: 'fas fa-box-open', name: 'Прочие материалы' },
            { val: 'fas fa-truck', name: 'Доставка / Подъем' },
            { val: 'fas fa-tools', name: 'Инструмент / Монтаж' }
        ];

        let items = [];

        function formatNumber(num) {
            return new Intl.NumberFormat('ru-RU', { minimumFractionDigits: 0, maximumFractionDigits: 0 }).format(num);
        }

        function handleImageUpload(input, index) {
            const file = input.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    items[index].imageBase64 = e.target.result;
                    updatePreview();
                };
                reader.readAsDataURL(file);
            }
        }

        function updateItemData(index, field, value) {
            if (field === 'qty' || field === 'price') items[index][field] = parseFloat(value.replace(',', '.')) || 0;
            else items[index][field] = value;
            if (field === 'visualType') renderForm(); else updatePreview();
        }

        function removeItem(index) { items.splice(index, 1); renderForm(); updatePreview(); }

        function addItem(type = 'icon', iconClass = 'fas fa-trowel', desc = 'Новая позиция', price = 1000) {
            items.push({ visualType: type, iconClass: iconClass, imageBase64: '', desc: desc, qty: 1, price: price });
            renderForm(); updatePreview();
        }

        function renderForm() {
            const container = document.getElementById('items-container');
            container.innerHTML = '';

            items.forEach((item, index) => {
                let visualControlHTML = item.visualType === 'image'
                    ? `<input type="file" accept="image/*" onchange="handleImageUpload(this, ${index})" style="margin-top:5px;">`
                    : `<select onchange="updateItemData(${index}, 'iconClass', this.value)" style="margin-top:5px;">
                        ${availableIcons.map(ic => `<option value="${ic.val}" ${item.iconClass === ic.val ? 'selected' : ''}>${ic.name}</option>`).join('')}
                       </select>`;

                const div = document.createElement('div');
                div.className = 'item-input-block';
                div.innerHTML = `
                    <button class="remove-btn" onclick="removeItem(${index})"><i class="fas fa-times"></i></button>
                    <div class="form-group" style="padding-right: 30px;">
                        <label>Изображение или иконка</label>
                        <select onchange="updateItemData(${index}, 'visualType', this.value)">
                            <option value="icon" ${item.visualType === 'icon' ? 'selected' : ''}>Векторная иконка</option>
                            <option value="image" ${item.visualType === 'image' ? 'selected' : ''}>Загрузить картинку</option>
                        </select>
                        ${visualControlHTML}
                    </div>
                    <div class="form-group"><label>Описание</label><input type="text" value="${item.desc}" oninput="updateItemData(${index}, 'desc', this.value)"></div>
                    <div style="display:flex; gap: 10px;">
                        <div class="form-group" style="flex:1;"><label>Кол-во</label><input type="number" step="0.01" value="${item.qty}" oninput="updateItemData(${index}, 'qty', this.value)"></div>
                        <div class="form-group" style="flex:2;"><label>Цена за ед. (₽)</label><input type="number" step="1" value="${item.price}" oninput="updateItemData(${index}, 'price', this.value)"></div>
                    </div>`;
                container.appendChild(div);
            });
        }

        // ─────────────────────────────────────────────
        //  ГЕНЕРАЦИЯ HTML ДЛЯ ОДНОЙ СТРАНИЦЫ
        // ─────────────────────────────────────────────
        function buildPageHTML({ isFirstPage, rows, grandTotal, showFooter, pageNum = 1, totalPages = 1 }) {
            const cCompany  = document.getElementById('c-company').value;
            const cSub      = document.getElementById('c-sub').value;
            const cName     = document.getElementById('c-name').value;
            const cPhone    = document.getElementById('c-phone').value;
            const cEmail    = document.getElementById('c-email').value;
            const cAbout    = document.getElementById('c-about').value;
            const cTitle    = document.getElementById('c-main-title').value;
            const cSubTitle = document.getElementById('c-sub-title').value;

            const headerHtml = `
                <div class="kp-header">
                    <div class="kp-logo"><h1>${cCompany}</h1><p>${cSub}</p></div>
                    <div class="kp-contacts">
                        <strong>${cName}</strong><br><div style="margin-top:5px;"></div>
                        <i class="fas fa-phone"></i> <span>${cPhone}</span><br>
                        <i class="fas fa-envelope"></i> <span>${cEmail}</span>
                    </div>
                </div>`;

            const titleHtml = isFirstPage ? `
                <div class="kp-title-block">
                    <h2>${cTitle}</h2>
                    <p>${cSubTitle}</p>
                </div>` : '';

            const rowsHtml = rows.map(item => {
                const sum = item.qty * item.price;
                const vis = item.visualType === 'image'
                    ? `<img src="${item.imageBase64 || 'data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs='}">`
                    : `<i class="${item.iconClass}"></i>`;
                return `
                    <tr class="kp-row">
                        <td class="visual-cell"><div class="visual-box">${vis}</div></td>
                        <td><strong style="font-weight:500;font-size:13px;color:#fff;">${item.desc}</strong></td>
                        <td class="right">${item.qty}</td>
                        <td class="right">${formatNumber(item.price)}</td>
                        <td class="right" style="color:#fff;font-weight:500;">${formatNumber(sum)}</td>
                    </tr>`;
            }).join('');

            const tableHtml = `
                <table class="kp-table">
                    <thead><tr>
                        <th colspan="2">Наименование</th>
                        <th class="right">Кол-во</th>
                        <th class="right">Цена</th>
                        <th class="right">Итого</th>
                    </tr></thead>
                    <tbody>${rowsHtml}</tbody>
                </table>`;

            // Последняя страница: итог + о нас + контакты
            const footerHtml = showFooter ? `
                <div class="kp-bottom-block">
                    <div class="kp-total-wrapper">
                        <div class="kp-total-box">
                            <span class="lbl">Общая стоимость</span>
                            <span class="sum">${formatNumber(grandTotal)} ₽</span>
                        </div>
                    </div>
                    <div class="kp-rich-footer">
                        <div class="footer-col-left">
                            <h4>О НАШЕЙ КОМПАНИИ</h4>
                            <p>${cAbout.replace(/\n/g, '<br>')}</p>
                        </div>
                        <div class="footer-col-right">
                            <h4>СВЯЗАТЬСЯ С НАМИ</h4>
                            <p><i class="fas fa-user"></i> <strong>${cName}</strong></p>
                            <p><i class="fas fa-phone"></i> <span>${cPhone}</span></p>
                            <p><i class="fas fa-envelope"></i> <span>${cEmail}</span></p>
                        </div>
                    </div>
                    ${totalPages > 1 ? `<div class="kp-page-num">${pageNum} / ${totalPages}</div>` : ''}
                </div>` : `
                <div class="kp-continuation">
                    <span class="cont-text"><i class="fas fa-arrow-down"></i> Продолжение на следующей странице</span>
                    <span class="cont-pages">${pageNum} / ${totalPages}</span>
                </div>`;

            return headerHtml + titleHtml + tableHtml + footerHtml;
        }

        // ─────────────────────────────────────────────
        //  ПАГИНАЦИЯ: разбивает items на страницы
        //  с учётом реальной высоты строк
        // ─────────────────────────────────────────────
        function paginateItems() {
            // Создаём скрытый измеритель с теми же стилями
            const ruler = document.createElement('div');
            ruler.className = 'a4-page';
            ruler.style.cssText = 'position:absolute;visibility:hidden;left:-9999px;top:0;';
            document.body.appendChild(ruler);

            const PAGE_H = 1131 - 100; // высота минус паддинги (50px × 2)

            // Динамически замеряем высоту блока итога + подвала
            ruler.innerHTML = buildPageHTML({ isFirstPage: false, rows: [], grandTotal: 0, showFooter: true, pageNum: 1, totalPages: 2 });
            const bottomBlock = ruler.querySelector('.kp-bottom-block');
            const FOOTER_H = bottomBlock ? bottomBlock.offsetHeight + 20 : 260;

            // Замеряем высоту плашки "продолжение"
            ruler.innerHTML = buildPageHTML({ isFirstPage: false, rows: [], grandTotal: 0, showFooter: false, pageNum: 1, totalPages: 2 });
            const contBlock = ruler.querySelector('.kp-continuation');
            const CONTINUATION_H = contBlock ? contBlock.offsetHeight + 20 : 60;

            // На каждой странице снизу будет либо футер, либо плашка — берём максимум
            const BOTTOM_RESERVE = Math.max(FOOTER_H, CONTINUATION_H);
            const HEADER_TITLE_H = (() => {
                ruler.innerHTML = buildPageHTML({ isFirstPage: true, rows: [], grandTotal: 0, showFooter: false });
                return ruler.querySelector('.kp-header').offsetHeight
                     + (ruler.querySelector('.kp-title-block')?.offsetHeight || 0)
                     + (ruler.querySelector('.kp-table')?.offsetHeight || 0); // только thead
            })();
            const HEADER_ONLY_H = (() => {
                ruler.innerHTML = buildPageHTML({ isFirstPage: false, rows: [], grandTotal: 0, showFooter: false });
                return ruler.querySelector('.kp-header').offsetHeight
                     + ruler.querySelector('.kp-table').offsetHeight;
            })();

            const pages = [];
            let currentRows = [];
            let isFirst     = true;
            let usedH       = HEADER_TITLE_H;

            for (let i = 0; i < items.length; i++) {
                const item = items[i];

                // Замеряем высоту строки
                ruler.innerHTML = buildPageHTML({ isFirstPage: isFirst, rows: [item], grandTotal: 0, showFooter: false, pageNum: 1, totalPages: 2 });
                const rowEl = ruler.querySelector('.kp-row');
                const rowH  = rowEl ? rowEl.offsetHeight : 92;

                // Каждая страница резервирует место под нижний блок (футер или плашку)
                if (usedH + rowH + BOTTOM_RESERVE > PAGE_H && currentRows.length > 0) {
                    pages.push({ isFirstPage: isFirst, rows: [...currentRows], showFooter: false });
                    currentRows = [];
                    isFirst     = false;
                    usedH       = HEADER_ONLY_H;
                }

                currentRows.push(item);
                usedH += rowH;
            }

            // Последняя страница — всегда с футером
            if (currentRows.length > 0 || pages.length === 0) {
                pages.push({ isFirstPage: isFirst, rows: currentRows, showFooter: true });
            } else if (pages.length > 0) {
                // Случай когда последний item вытолкнул на новую страницу
                pages[pages.length - 1].showFooter = true;
            }

            document.body.removeChild(ruler);
            return pages;
        }

        // ─────────────────────────────────────────────
        //  РЕНДЕР ПРЕВЬЮ
        // ─────────────────────────────────────────────
        function updatePreview() {
            const wrapper = document.getElementById('pdf-wrapper');
            wrapper.innerHTML = '';

            const grandTotal = items.reduce((s, it) => s + it.qty * it.price, 0);
            const pages = paginateItems();
            const totalPages = pages.length;

            pages.forEach((page, idx) => {
                if (totalPages > 1) {
                    const lbl = document.createElement('div');
                    lbl.className = 'page-label';
                    lbl.textContent = `Страница ${idx + 1} из ${totalPages}`;
                    wrapper.appendChild(lbl);
                }

                const pageEl = document.createElement('div');
                pageEl.className = 'a4-page';
                pageEl.innerHTML = buildPageHTML({
                    isFirstPage: page.isFirstPage,
                    rows: page.rows,
                    grandTotal,
                    showFooter: page.showFooter,
                    pageNum: idx + 1,
                    totalPages
                });
                wrapper.appendChild(pageEl);
            });

            // Применяем масштаб для мобильного превью
            applyPreviewScale();
        }

        // ─────────────────────────────────────────────
        //  ГЕНЕРАЦИЯ PDF
        //  Каждая .a4-page рендерится отдельно →
        //  собирается в многостраничный PDF через jsPDF
        // ─────────────────────────────────────────────
        async function generatePDF() {
            // Блокируем все кнопки генерации (десктоп + мобайл)
            const allBtns = document.querySelectorAll('.btn-generate');
            allBtns.forEach(b => { b.disabled = true; b.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Генерация...'; });

            try {
                const { jsPDF } = window.jspdf;
                const pages    = Array.from(document.querySelectorAll('#pdf-wrapper .a4-page'));
                const subTitle = document.getElementById('c-sub-title').value.replace(/[^a-zа-яёА-ЯЁ0-9]/gi, '_');

                // ── Рендерим из клонов в скрытом контейнере без transform ──
                // Это гарантирует корректный захват на мобиле, где #preview-scaler масштабирован
                const offscreen = document.createElement('div');
                offscreen.style.cssText = [
                    'position:fixed', 'left:-9999px', 'top:0',
                    'width:800px', 'background:#151515',
                    'display:flex', 'flex-direction:column', 'gap:0',
                    'z-index:-1', 'pointer-events:none'
                ].join(';');
                document.body.appendChild(offscreen);

                const clones = pages.map(p => {
                    const clone = p.cloneNode(true);
                    clone.style.transform = 'none'; // сброс любых трансформаций
                    offscreen.appendChild(clone);
                    return clone;
                });

                // Ждём один кадр чтобы браузер отрисовал клоны
                await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));

                const pdf = new jsPDF({
                    unit: 'px',
                    format: [800, 1131],
                    orientation: 'portrait',
                    hotfixes: ['px_scaling']
                });

                for (let i = 0; i < clones.length; i++) {
                    if (i > 0) pdf.addPage([800, 1131], 'portrait');

                    const canvas = await html2canvas(clones[i], {
                        scale: 2,
                        useCORS: true,
                        backgroundColor: '#151515',
                        width: 800,
                        height: 1131,
                        scrollX: 0,
                        scrollY: 0,
                        logging: false
                    });

                    pdf.addImage(canvas.toDataURL('image/jpeg', 0.97), 'JPEG', 0, 0, 800, 1131);
                }

                document.body.removeChild(offscreen);
                pdf.save(`КП_${subTitle}.pdf`);
            } catch (err) {
                console.error('PDF generation error:', err);
                alert('Ошибка генерации PDF:\n' + err.message);
            } finally {
                allBtns.forEach(b => { b.disabled = false; b.innerHTML = '<i class="fas fa-file-pdf"></i> Сохранить PDF'; });
            }
        }

        // ─────────────────────────────────────────────
        //  МОБИЛЬНАЯ НАВИГАЦИЯ И МАСШТАБИРОВАНИЕ
        // ─────────────────────────────────────────────
        const isMobile = () => window.innerWidth <= 900;

        function switchTab(tab) {
            document.querySelectorAll('.mobile-tab').forEach(t =>
                t.classList.toggle('active', t.dataset.tab === tab)
            );
            const settings = document.getElementById('panel-settings');
            const preview  = document.getElementById('panel-preview');
            const genBar   = document.getElementById('mobile-generate-bar');

            if (tab === 'settings') {
                settings.classList.remove('tab-hidden');
                preview.classList.add('tab-hidden');
                genBar.classList.remove('visible');
            } else {
                settings.classList.add('tab-hidden');
                preview.classList.remove('tab-hidden');
                genBar.classList.add('visible');
                applyPreviewScale();
            }

            // Ждём два кадра пока браузер пересчитает layout после показа/скрытия панелей,
            // затем скроллим в начало чтобы minHeight не утащил страницу вниз
            requestAnimationFrame(() => requestAnimationFrame(() => window.scrollTo({ top: 0, behavior: 'instant' })));
        }

        function applyPreviewScale() {
            if (!isMobile()) {
                const scaler = document.getElementById('preview-scaler');
                scaler.style.transform = '';
                scaler.style.width = '';
                scaler.style.height = '';
                return;
            }

            const scaler  = document.getElementById('preview-scaler');
            const wrapper = document.getElementById('pdf-wrapper');
            const panel   = document.getElementById('panel-preview');

            const available = panel.clientWidth || window.innerWidth;
            const scale = available / 800;

            // Считаем реальную высоту контента (страницы + gap'ы между ними)
            const pages = wrapper.querySelectorAll('.a4-page');
            const GAP = 20;
            const naturalH = pages.length > 0
                ? pages.length * 1131 + (pages.length - 1) * GAP
                : 1131;

            scaler.style.transform = `scale(${scale})`;
            scaler.style.transformOrigin = 'top left';
            scaler.style.width = '800px';
            scaler.style.height = naturalH + 'px';

            // Выставляем высоту внешнего контейнера чтобы не было лишнего скролла
            panel.style.minHeight = Math.ceil(naturalH * scale + 80) + 'px';
        }

        window.addEventListener('resize', () => {
            if (isMobile()) applyPreviewScale();
            else applyPreviewScale(); // сброс
        });

        // --- СТАРТ ---
        window.onload = () => {
            addItem('icon', 'fas fa-trowel',        'Штукатурка гипсовая Knauf Rotband (30кг)', 520);
            addItem('icon', 'fas fa-paint-roller',  'Комплекс малярных работ (кв.м)',            1200);
            addItem('icon', 'fas fa-tape',           'Малярная лента, укрывочная пленка, расходники', 3500);
            renderForm();
            updatePreview();
        };
    </script>
</body>
</html>
